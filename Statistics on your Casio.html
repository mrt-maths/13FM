<style>
/* Layout: one column of question cards on a graph-paper ground; key presses drawn as keycaps. */
:root {
  --bg: #EDF1F4; --grid: #DAE2E8; --surface: #FFFFFF; --ink: #14212B; --muted: #4F606C;
  --line: #C6D1D9; --accent: #0B6B75; --accent-ink: #FFFFFF; --accent-soft: #DDF0F2;
  --good: #17703A; --good-soft: #DCF1E3; --bad: #AE2A22; --bad-soft: #FBE3E1;
  --warn-soft: #FFF1CF; --warn-ink: #5A4200; --key: #E6ECF0; --key-edge: #9BA9B4;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E161C; --grid: #16222B; --surface: #152029; --ink: #E5EDF2; --muted: #9DADB8;
  --line: #2B3B47; --accent: #4CC2CB; --accent-ink: #04262A; --accent-soft: #11343A;
  --good: #62D08C; --good-soft: #123422; --bad: #FF9088; --bad-soft: #3D1B19;
  --warn-soft: #3A2F12; --warn-ink: #F2D98E; --key: #22323D; --key-edge: #4D6171; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E161C; --grid: #16222B; --surface: #152029; --ink: #E5EDF2; --muted: #9DADB8;
  --line: #2B3B47; --accent: #4CC2CB; --accent-ink: #04262A; --accent-soft: #11343A;
  --good: #62D08C; --good-soft: #123422; --bad: #FF9088; --bad-soft: #3D1B19;
  --warn-soft: #3A2F12; --warn-ink: #F2D98E; --key: #22323D; --key-edge: #4D6171; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background-color: var(--bg); color: var(--ink); font: 16px/1.55 var(--body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; padding-block: 0 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 820px; margin: 0 auto; }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 10px 0 0;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.05rem; margin-right: auto; }
.swap { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
.swap select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.prog { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog b { color: var(--ink); }
.meter { flex-basis: 100%; height: 4px; background: var(--line); margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--accent); transition: width .3s; }

/* picker */
.intro { padding-block: 40px 22px; display: grid; gap: 14px; }
.intro h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 700; letter-spacing: -.01em; }
.lede { max-width: 58ch; color: var(--muted); font-size: 1.05rem; }
.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-family: var(--body); font-weight: 600; margin-bottom: 12px; }
.models { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.model { text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--line);
  border-bottom-width: 4px; border-radius: 10px; padding: 16px; display: grid; gap: 4px; min-width: 0; }
.model:hover { border-color: var(--accent); }
.model:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.model-name { font-family: var(--mono); font-weight: 500; font-size: 1.15rem; }
.model-line { color: var(--muted); font-size: .9rem; }
.fine { margin-top: 14px; font-size: .85rem; color: var(--muted); max-width: 70ch; }
.rules { margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
.rules ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }

/* questions */
.section { font-size: 1.35rem; margin: 40px 0 14px; font-weight: 700; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; display: grid; gap: 14px; min-width: 0; }
.q-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.q-num { font-family: var(--mono); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 500; }
.q-topic { font-family: var(--display); font-weight: 700; font-size: 1.15rem; }
.q-state { margin-left: auto; font-size: .8rem; color: var(--muted); }
.q-state[data-state="ok"] { color: var(--good); font-weight: 600; }
.q-state[data-state="part"] { color: var(--warn-ink); font-weight: 600; }
.q-body { max-width: 68ch; display: grid; gap: 12px; min-width: 0; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chips li { font-family: var(--mono); font-variant-numeric: tabular-nums; background: var(--accent-soft); border-radius: 6px; padding: 2px 9px; }
.tscroll { overflow-x: auto; max-width: 100%; }
.dt { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .95rem; }
.dt th, .dt td { border: 1px solid var(--line); padding: 6px 12px; text-align: right; white-space: nowrap; }
.dt th:first-child, .dt td:first-child { text-align: left; }
.dt th { background: var(--accent-soft); font-weight: 600; }

.parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 18px; }
.part { display: grid; gap: 4px; min-width: 0; }
.part label { font-size: .9rem; font-weight: 500; }
.field { display: grid; gap: 4px; }
.part input, .part select { font: inherit; font-family: var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--key-edge);
  border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
.part select { font-family: var(--body); }
.part[data-state="ok"] input, .part[data-state="ok"] select { border-color: var(--good); background: var(--good-soft); }
.part[data-state="bad"] input, .part[data-state="bad"] select { border-color: var(--bad); background: var(--bad-soft); }
.verdict { font-size: .82rem; min-height: 1.2em; color: var(--muted); }
.part[data-state="ok"] .verdict { color: var(--good); font-weight: 600; }
.part[data-state="bad"] .verdict { color: var(--bad); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: inherit; font-weight: 500; cursor: pointer; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--key-edge); background: var(--surface); color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.quiet { border-color: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }

/* help panel */
.help, .reveal { border-radius: 10px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.help { background: var(--accent-soft); }
.reveal { background: var(--bg); border: 1px dashed var(--key-edge); }
.help[hidden], .reveal[hidden] { display: none; }
.help-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: .85rem; color: var(--muted); }
.help-model { font-family: var(--mono); font-weight: 500; color: var(--accent-ink); background: var(--accent); border-radius: 5px; padding: 1px 8px; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; }
.steps li { padding-left: 4px; }
.steps li::marker { font-family: var(--mono); color: var(--accent); font-weight: 500; }
kbd { font-family: var(--mono); font-size: .82em; background: var(--key); border: 1px solid var(--key-edge); border-bottom-width: 3px;
  border-radius: 5px; padding: 0 .45em; white-space: nowrap; display: inline-block; line-height: 1.5; color: var(--ink); }
.callout { background: var(--warn-soft); color: var(--warn-ink); border-radius: 8px; padding: 10px 14px; font-size: .93rem; }
.callout kbd { color: var(--ink); }
.aside { font-size: .9rem; color: var(--muted); }
.reveal .dt td.num { text-align: right; font-family: var(--mono); }
.trap { background: var(--warn-soft); color: var(--warn-ink); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; font-size: .93rem; }
.trap-row { display: flex; justify-content: space-between; gap: 12px; }
.trap-row .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bad-n { text-decoration: line-through; }

.summary { background: var(--good-soft); border: 1px solid var(--good); border-radius: 12px; padding: 20px; margin-top: 24px; display: grid; gap: 6px; }
.summary[hidden] { display: none; }

@media (max-width: 520px) {
  .q { padding: 16px; }
  .brand { flex-basis: 100%; }
  .actions .btn { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }

<script>
/* ---------- Maths helpers (answers are always computed, never typed in) ---------- */
const sum = a => a.reduce((x, y) => x + y, 0);
const mean = a => sum(a) / a.length;
const popVar = a => { const m = mean(a); return sum(a.map(x => (x - m) ** 2)) / a.length; };
const popSd = a => Math.sqrt(popVar(a));
const sampSd = a => { const m = mean(a); return Math.sqrt(sum(a.map(x => (x - m) ** 2)) / (a.length - 1)); };
const median = a => { const s = [...a].sort((x, y) => x - y), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
// Casio method: split into lower and upper halves (median left out when n is odd)
const quart = a => { const s = [...a].sort((x, y) => x - y), n = s.length, h = Math.floor(n / 2); return { q1: median(s.slice(0, h)), q3: median(s.slice(n - h)) }; };
const expand = (v, f) => { const o = []; v.forEach((x, i) => { for (let k = 0; k < f[i]; k++) o.push(x); }); return o; };
const sig = (x, n) => Number(x.toPrecision(n));
const fmt = (x, n = 6) => { const v = Number(x.toPrecision(n)); return Math.abs(v) < 1e-4 && v !== 0 ? v.toExponential(3) : String(v); };

function linReg(xs, ys) {
  const n = xs.length, mx = mean(xs), my = mean(ys);
  const sxx = sum(xs.map(x => (x - mx) ** 2)), syy = sum(ys.map(y => (y - my) ** 2));
  const sxy = sum(xs.map((x, i) => (x - mx) * (ys[i] - my)));
  const b = sxy / sxx, a = my - b * mx, r = sxy / Math.sqrt(sxx * syy);
  return { a, b, r };
}
function binPmf(k, n, p) {
  if (k < 0 || k > n) return 0;
  let c = 1; for (let i = 1; i <= k; i++) c = c * (n - k + i) / i;
  return c * Math.pow(p, k) * Math.pow(1 - p, n - k);
}
const binCdf = (k, n, p) => { if (k < 0) return 0; let s = 0; for (let i = 0; i <= Math.min(k, n); i++) s += binPmf(i, n, p); return s; };
function phi(z) {
  if (z < -8) return 0; if (z > 8) return 1;
  const az = Math.abs(z); let term = az, s = az;
  for (let i = 1; i < 400; i++) { term *= az * az / (2 * i + 1); s += term; if (term < 1e-18 * s) break; }
  const v = 0.5 + s * Math.exp(-az * az / 2) / Math.sqrt(2 * Math.PI);
  return z >= 0 ? v : 1 - v;
}
const normCdf = (lo, hi, mu, sd) => phi((hi - mu) / sd) - phi((lo - mu) / sd);
function invPhi(p) { let lo = -10, hi = 10; for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (phi(m) < p) lo = m; else hi = m; } return (lo + hi) / 2; }
const invNorm = (p, mu, sd) => mu + sd * invPhi(p);

/* ---------- Calculator models ---------- */
const MODELS = {
  cg50:  { name: 'fx-CG50',  line: 'Graphic calculator, F1 to F6 menu keys' },
  cg100: { name: 'fx-CG100', line: 'ClassPad touchscreen' },
  ex:    { name: 'fx-991EX', line: 'ClassWiz, natural display' },
  cw:    { name: 'fx-991CW', line: 'Newer ClassWiz (also fx-570CW)' }
};
const K = (...a) => a.map(s => `<kbd>${s}</kbd>`).join(' ');
const INF = { cg50: K('EXP'), cg100: 'EE', ex: K('×10ˣ'), cw: K('×10ˣ') };

/* ---------- Help generators: one array of HTML steps per model ---------- */
function oneVar(m, freq, note) {
  const fq = freq ? 'List 2' : '1';
  const t = {
    cg50: [
      `Press ${K('MENU')} and open <b>Statistics</b>.`,
      freq ? `Clear any old data. Type the values into <b>List 1</b> and the frequencies into <b>List 2</b>, pressing ${K('EXE')} after each number.`
           : `Clear any old data. Type the numbers into <b>List 1</b>, pressing ${K('EXE')} after each one.`,
      `Press ${K('F2')} (CALC), then ${K('F6')} (SET). Set <b>1Var XList</b> to List 1 and <b>1Var Freq</b> to ${fq}. Press ${K('EXIT')}.`,
      `Press ${K('F1')} (1-VAR) and scroll with ${K('▼')}. <b>x̄</b> is the mean, <b>σx</b> the population standard deviation, <b>sx</b> the sample standard deviation, followed by <b>minX</b>, <b>Q1</b>, <b>Med</b>, <b>Q3</b>, <b>maxX</b>. Check that <b>n</b> is what you expect.`
    ],
    cg100: [
      `Tap the Menu icon and open the <b>Statistics</b> app.`,
      freq ? `Type the values into the first list column and the frequencies into the second list column.` : `Type the numbers into the first list column, pressing ${K('EXE')} after each one.`,
      `Tap <b>Calc</b>, then <b>One-Variable</b>. Set <b>XList</b> to the list holding your values and <b>Freq</b> to ${freq ? 'the frequency list' : '1'}. Tap <b>OK</b>.`,
      `Scroll the results: <b>x̄</b> (mean), <b>σx</b> (population SD), <b>sx</b> (sample SD), <b>Q1</b>, <b>Med</b>, <b>Q3</b>. Check <b>n</b>.`
    ],
    ex: [
      `Press ${K('MENU')}, choose <b>Statistics</b>, then <b>1-Variable</b>.` + (freq ? ` Before typing, press ${K('SHIFT')} ${K('MENU')} (SETUP), scroll to <b>Statistics</b> and turn <b>Frequency</b> on.` : ''),
      freq ? `Type the values in the <b>x</b> column and the frequencies in the <b>FREQ</b> column, pressing ${K('=')} after each number.` : `Type the numbers in the <b>x</b> column, pressing ${K('=')} after each one.`,
      `Press ${K('OPTN')} and choose <b>1-Variable Calc</b>. Scroll with ${K('▼')}: <b>x̄</b> is the mean, <b>σx</b> the population SD, <b>sx</b> the sample SD, <b>n</b>, then <b>minX</b>, <b>Q1</b>, <b>Med</b>, <b>Q3</b>, <b>maxX</b>.`,
      `To use a result in a calculation, press ${K('AC')}, then ${K('SHIFT')} ${K('1')} (STAT) and choose <b>Var</b> or <b>MinMax</b>.`
    ],
    cw: [
      `Press ${K('MENU')}, choose <b>Statistics</b>, then <b>1-Variable</b>.` + (freq ? ` If there is no frequency column, open SETUP (${K('SHIFT')} ${K('MENU')}) and turn <b>Frequency</b> on.` : ''),
      freq ? `Type the values in the <b>x</b> column and the frequencies in the <b>Freq</b> column.` : `Type the numbers in the <b>x</b> column.`,
      `Press ${K('OPTN')} and choose <b>1-Variable Calc</b> (or the Calc option shown on screen). Scroll to read <b>x̄</b> (mean), <b>σx</b> (population SD), <b>sx</b> (sample SD), <b>n</b>, <b>Q1</b>, <b>Med</b>, <b>Q3</b>.`,
      `To use a result in a calculation, press ${K('AC')} then ${K('SHIFT')} ${K('1')} (STAT) and pick it from <b>Var</b> or <b>MinMax</b>.`
    ]
  }[m].slice();
  if (note) t.push(note[m] || note.all);
  return t;
}
function twoVar(m) {
  return {
    cg50: [
      `Press ${K('MENU')} and open <b>Statistics</b>. Clear old data. Type the <b>x</b> values into <b>List 1</b> and the <b>y</b> values into <b>List 2</b>.`,
      `Press ${K('F2')} (CALC), then ${K('F6')} (SET). Set <b>2Var XList</b> to List 1, <b>2Var YList</b> to List 2 and <b>2Var Freq</b> to 1. Press ${K('EXIT')}.`,
      `Press ${K('F3')} (REG), then ${K('F1')} (X) for linear regression in the form <b>y = ax + b</b>.`,
      `Read <b>a</b> (the gradient), <b>b</b> (the intercept) and <b>r</b> (the PMCC). Careful: on this screen a is the gradient, which is the other way round from y = a + bx in your notes.`
    ],
    cg100: [
      `Tap the Menu icon and open the <b>Statistics</b> app. Type the <b>x</b> values into the first list and the <b>y</b> values into the second.`,
      `Tap <b>Calc</b>, then <b>Linear Reg</b>. Set <b>XList</b> and <b>YList</b> to your two lists and <b>Freq</b> to 1. Tap <b>OK</b>.`,
      `Read <b>a</b>, <b>b</b> and <b>r</b>. If the equation shown is y = ax + b, then a is the gradient and b the intercept.`
    ],
    ex: [
      `Press ${K('MENU')}, choose <b>Statistics</b>, then <b>y = a + bx</b>.`,
      `Type the <b>x</b> values in the X column and the <b>y</b> values in the Y column, pressing ${K('=')} after each number.`,
      `Press ${K('OPTN')} and choose <b>Regression Calc</b>. Read <b>A</b> (the intercept), <b>B</b> (the gradient) and <b>r</b> (the PMCC). Here the equation is y = A + Bx.`
    ],
    cw: [
      `Press ${K('MENU')}, choose <b>Statistics</b>, then <b>y = a + bx</b>.`,
      `Type the <b>x</b> values in the X column and the <b>y</b> values in the Y column.`,
      `Press ${K('OPTN')} and choose <b>Regression Calc</b>. Read <b>A</b> (the intercept), <b>B</b> (the gradient) and <b>r</b> (the PMCC). The equation is y = A + Bx.`
    ]
  }[m];
}
function predict(m, x1, x2) {
  return {
    cg50: [
      `Do the regression as in the previous question (${K('F2')} CALC, ${K('F3')} REG, ${K('F1')} X) so that a and b are stored.`,
      `Go to <b>Run-Matrix</b> from ${K('MENU')}. Press ${K('VARS')}, then <b>STAT</b>, then <b>GRPH</b>, and insert <b>a</b> and <b>b</b> from there. Calculate <b>a × ${x1} + b</b>. Never type in rounded copies of a and b.`,
      `Repeat for ${x2}. If your menus differ, ask your teacher to show you where the stored regression values live.`
    ],
    cg100: [
      `Run the linear regression first so that a and b are stored.`,
      `In the calculation screen, insert the stored <b>a</b> and <b>b</b> from the regression results or variable list, then calculate <b>a × ${x1} + b</b>. Never type in rounded copies.`,
      `Repeat for ${x2}.`
    ],
    ex: [
      `Do the regression first (MENU, Statistics, y = a + bx, enter data).`,
      `Press ${K('AC')}, type <b>${x1}</b>, then press ${K('SHIFT')} ${K('1')} (STAT), choose <b>Reg</b>, then <b>ŷ</b>, and press ${K('=')}. The calculator uses its own unrounded A and B.`,
      `Repeat for <b>${x2}</b>. Alternatively, insert <b>A</b> and <b>B</b> from ${K('SHIFT')} ${K('1')} → <b>Reg</b> and calculate A + B × ${x1}.`
    ],
    cw: [
      `Do the regression first (MENU, Statistics, y = a + bx, enter data).`,
      `Press ${K('AC')}, type <b>${x1}</b>, then press ${K('SHIFT')} ${K('1')} (STAT), choose <b>Reg</b>, then <b>ŷ</b>, and press ${K('=')}. This uses the unrounded A and B.`,
      `Repeat for <b>${x2}</b>. Alternatively, insert <b>A</b> and <b>B</b> from the Reg menu and calculate A + B × ${x1}.`
    ]
  }[m];
}
function binSteps(m, n, p, kind) {
  const open = {
    cg50: `Press ${K('MENU')}, open <b>Statistics</b>, press ${K('F5')} (DIST), then ${K('F5')} (BINM).`,
    cg100: `Open the <b>Statistics</b> app, then <b>Calc</b> → <b>Distribution</b>.`,
    ex: `Press ${K('MENU')} and choose <b>Distribution</b>.`,

    cw: `Choose <b>Normal CD</b>. Enter <b>Lower</b>, <b>Upper</b>, <b>σ</b> and <b>μ</b>, pressing ${K('=')} after each.`
  }[m];

      <h1>Statistics on your Casio</h1>
      <p class="lede">Twelve A-level statistics questions to answer with your calculator. Every question has a <b>Help</b> button that gives the key presses for your model.</p>
    </section>
    <section aria-labelledby="pick-h">
      <h2 id="pick-h" class="label">Which calculator are you using?</h2>
      <div class="models" role="radiogroup" aria-labelledby="pick-h">
        ${Object.keys(MODELS).map(k => `
          <button class="model" role="radio" aria-checked="false" data-act="pick" data-model="${k}">
            <span class="model-name">${MODELS[k].name}</span>
            <span class="model-line">${MODELS[k].line}</span>
          </button>`).join('')}
      </div>
      <p class="fine">Key sequences follow Casio's standard menus. Menu wording can differ a little between calculator software versions, so if a screen looks different from the instructions, look for the closest option or ask your teacher.</p>
    </section>
    <section class="rules">
      <h2 class="label">Before you start</h2>
      <ul>
        <li>Give answers to <b>3 significant figures</b> unless the question says otherwise.</li>
        <li>Do not round part-way through a calculation. Carry full values forward with <kbd>Ans</kbd> or stored variables.</li>
        <li>You can change calculator at any time from the bar at the top.</li>
      </ul>
    </section>`;
  }

  function partHTML(qi, pi, p) {
    const id = `q${qi}p${pi}`;
    if (p.type === 'select') {
      return `<div class="part" data-part="${pi}">
        <label for="${id}">${p.label}</label>
        <div class="field"><select id="${id}"><option value="">Choose a group</option>${p.options.map((o, i) => `<option value="${i}">${o}</option>`).join('')}</select>
        <span class="verdict" aria-live="polite"></span></div></div>`;
    }
    return `<div class="part" data-part="${pi}">
      <label for="${id}">${p.label}</label>
      <div class="field"><input id="${id}" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="Answer">
      <span class="verdict" aria-live="polite"></span></div></div>`;
  }

  function questionHTML(q, qi, newSection) {
    return `${newSection ? `<h2 class="section">${q.section}</h2>` : ''}
    <article class="q" id="q${qi}" data-q="${qi}">
      <header class="q-head">
        <span class="q-num">Question ${qi + 1}</span>
        <span class="q-topic">${q.topic}</span>
        <span class="q-state" data-state="open">Not yet answered</span>
      </header>
      <div class="q-body">${q.text}</div>
      <div class="parts">${q.parts.map((p, pi) => partHTML(qi, pi, p)).join('')}</div>
      <div class="actions">
        <button class="btn primary" data-act="check" data-q="${qi}">Check answers</button>
        <button class="btn" data-act="help" data-q="${qi}" aria-expanded="false" aria-controls="h${qi}">Help with my calculator</button>
        <button class="btn quiet" data-act="reveal" data-q="${qi}" aria-expanded="false" aria-controls="r${qi}">Show answers</button>
      </div>
      <div class="help" id="h${qi}" hidden></div>
      <div class="reveal" id="r${qi}" hidden></div>
    </article>`;
  }

  function helpHTML(q) {
    const m = state.model;
    const steps = q.help(m).map(s => `<li>${s}</li>`).join('');
    return `<div class="help-head"><span class="help-model">${MODELS[m].name}</span><span>Step by step</span></div>
      <ol class="steps">${steps}</ol>
      ${q.tip ? `<p class="callout">${q.tip}</p>` : ''}
      ${q.note ? `<p class="aside">${q.note}</p>` : ''}`;
  }

  function revealHTML(q) {
    const rows = q.parts.map(p => `<tr><td>${p.label}</td><td class="num">${p.type ? esc(p.options[p.ans]) : fmt(p.ans, 6)}</td></tr>`).join('');
    let extra = '';
    if (q.reveal) extra += `<p class="aside">${q.reveal()}</p>`;
    if (q.trap) {
      const same = sig(q.trap.exact, 3) === sig(q.trap.rounded, 3);
      extra += `<div class="trap"><b>${q.trap.title}</b>
        <div class="trap-row"><span>Full calculator values</span><span class="num">${fmt(q.trap.exact, 5)}</span></div>
        <div class="trap-row"><span>${q.trap.text}</span><span class="num bad-n">${fmt(q.trap.rounded, 5)}</span></div>
        <p>${same ? 'These agree to 3 s.f. here, but this will not always be true.' : `To 3 s.f. these are ${fmt(q.trap.exact, 3)} and ${fmt(q.trap.rounded, 3)}. Rounding early gives a wrong final answer.`}</p></div>`;
    }
    return `<table class="dt"><thead><tr><th>Part</th><th>Answer (6 s.f.)</th></tr></thead><tbody>${rows}</tbody></table>${extra}`;
  }

  function buildQuiz() {
    let prev = '';
    app.innerHTML = QUESTIONS.map((q, i) => { const ns = q.section !== prev; prev = q.section; return questionHTML(q, i, ns); }).join('') +
      `<section class="summary" id="summary" hidden><h2>All done</h2><p id="summary-text"></p></section>`;
    QUESTIONS.forEach((q, i) => { document.getElementById('h' + i).innerHTML = helpHTML(q); });
  }

  function bar_() {
    if (!state.model) { bar.innerHTML = `<span class="brand">Statistics on your Casio</span>`; return; }
    const n = Object.keys(state.done).length;
    bar.innerHTML = `<span class="brand">Statistics on your Casio</span>
      <label class="swap"><span>Calculator</span>
        <select id="swap-model" aria-label="Change calculator model">${Object.keys(MODELS).map(k => `<option value="${k}"${k === state.model ? ' selected' : ''}>${MODELS[k].name}</option>`).join('')}</select></label>
      <span class="prog" role="status"><b>${n}</b> of ${QUESTIONS.length} correct</span>
      <span class="meter" aria-hidden="true"><i style="width:${(n / QUESTIONS.length) * 100}%"></i></span>`;
  }

  function show() {
    bar_();
    if (!state.model) { app.innerHTML = pickerHTML(); }
    else { buildQuiz(); }
  }

  function check(qi) {
    const q = QUESTIONS[qi], card = document.getElementById('q' + qi);
    let ok = 0;
    q.parts.forEach((p, pi) => {
      const el = document.getElementById(`q${qi}p${pi}`), box = card.querySelector(`[data-part="${pi}"]`), v = box.querySelector('.verdict');
      let good = false, msg = '';
      const raw = el.value.trim().replace(/−/g, '-').replace(/,/g, '');
      if (!raw) { box.dataset.state = ''; v.textContent = 'Enter an answer'; return; }
      if (p.type === 'select') { good = Number(raw) === p.ans; msg = good ? 'Correct' : 'Not quite. Check the cumulative frequencies.'; }
      else {
        const u = Number(raw);
        if (!isFinite(u)) { box.dataset.state = 'bad'; v.textContent = 'Type a number'; return; }
        good = Math.abs(u - p.ans) <= tolerance(p.ans);
        if (good) msg = 'Correct';
        else if (Math.abs(u - p.ans) / (Math.abs(p.ans) || 1) < 0.02) msg = 'Very close. Check for early rounding or the wrong standard deviation.';
        else msg = 'Not quite. Open Help and check each step.';
      }
      box.dataset.state = good ? 'ok' : 'bad'; v.textContent = msg; if (good) ok++;
    });
    const st = card.querySelector('.q-state');
    if (ok === q.parts.length) {
      state.done[qi] = true; st.dataset.state = 'ok'; st.textContent = 'Correct';
    } else {
      delete state.done[qi]; st.dataset.state = 'part'; st.textContent = `${ok} of ${q.parts.length} parts correct`;
    }
    bar_(); summary();
  }

  function summary() {
    const n = Object.keys(state.done).length, s = document.getElementById('summary');
    if (!s) return;
    if (n === QUESTIONS.length) {
      s.hidden = false;
      document.getElementById('summary-text').textContent = 'You answered every question correctly. Remember: keep full calculator values until the final answer.';
    } else s.hidden = true;
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'pick') {
      state.model = b.dataset.model;
      try { localStorage.setItem('stats-quiz-model', state.model); } catch (er) {}
      show(); window.scrollTo(0, 0); return;
    }
    const qi = Number(b.dataset.q);
    if (act === 'check') check(qi);
    if (act === 'help') {
      const h = document.getElementById('h' + qi), open = h.hidden;
      h.hidden = !open; b.setAttribute('aria-expanded', String(open));
      b.textContent = open ? 'Hide help' : 'Help with my calculator';
    }
    if (act === 'reveal') {
      const r = document.getElementById('r' + qi), open = r.hidden;
      if (open && !r.innerHTML) r.innerHTML = revealHTML(QUESTIONS[qi]);
      r.hidden = !open; b.setAttribute('aria-expanded', String(open));
      b.textContent = open ? 'Hide answers' : 'Show answers';
    }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'swap-model') {
      state.model = e.target.value;
      try { localStorage.setItem('stats-quiz-model', state.model); } catch (er) {}
      QUESTIONS.forEach((q, i) => { const h = document.getElementById('h' + i); if (h) h.innerHTML = helpHTML(q); });
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('.part input')) { const qi = e.target.closest('.q').dataset.q; check(Number(qi)); }
  });
  show();
})();

</script>

</body></html>
