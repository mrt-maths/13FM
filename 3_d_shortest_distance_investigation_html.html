<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Shortest Distances Investigation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: white;
    }

    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 370px;
      max-height: calc(100vh - 20px);
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 16px;
      z-index: 10;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #7dd3fc;
      font-size: 28px;
    }

    .modeButton {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      color: white;
      background: #1e293b;
      transition: 0.2s;
    }

    .modeButton:hover {
      background: #334155;
      transform: translateY(-1px);
    }

    .section {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.12);
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 4px;
      font-size: 14px;
      color: #cbd5e1;
    }

    input[type='range'] {
      width: 100%;
      cursor: pointer;
    }

    #distanceDisplay {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      line-height: 1.6;
      font-size: 17px;
    }

    #infoBox {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(125, 211, 252, 0.08);
      color: #dbeafe;
      line-height: 1.5;
      font-size: 14px;
    }

    #modeTitle {
      color: #facc15;
      margin-bottom: 6px;
      font-size: 18px;
      font-weight: bold;
    }

    #testResults {
      margin-top: 14px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(34,197,94,0.12);
      font-size: 13px;
      color: #bbf7d0;
      white-space: pre-line;
    }

    canvas {
      display: block;
    }
  </style>

  <script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

<div id="ui">
  <h1>3D Shortest Distances</h1>

  <button class="modeButton" onclick="setMode('pointLine')">
    A. Point and Line
  </button>

  <button class="modeButton" onclick="setMode('pointPlane')">
    B. Point and Plane
  </button>

  <button class="modeButton" onclick="setMode('parallelLines')">
    C. Parallel Lines
  </button>

  <button class="modeButton" onclick="setMode('skewLines')">
    D. Non-Parallel Lines
  </button>

  <div class="section">

    <label id="labelP">P parameter</label>
    <input type="range" min="-10" max="10" step="0.01" value="0" id="sliderP">

    <label id="labelQ1">Q parameter u</label>
    <input type="range" min="-10" max="10" step="0.01" value="0" id="sliderQ1">

    <label id="labelQ2">Q parameter v</label>
    <input type="range" min="-10" max="10" step="0.01" value="0" id="sliderQ2">

  </div>

  <div id="distanceDisplay"></div>

  <div id="infoBox">
    <div id="modeTitle">Point and Line</div>
    <div id="equationText"></div>

    <br>
    Rotate the scene with the mouse.
    <br>
    Zoom with the mouse wheel.
    <br><br>
    Move the sliders to reposition P and Q.
    <br><br>
    Try to minimise the distance |PQ|.
  </div>

  <div id="testResults"></div>
</div>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);

const camera = new THREE.PerspectiveCamera(
  50,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(20, 16, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 1.4);
directionalLight.position.set(15, 20, 10);
scene.add(directionalLight);

const axes = new THREE.AxesHelper(12);
scene.add(axes);

const grid = new THREE.GridHelper(30, 30, 0x555555, 0x333333);
scene.add(grid);

function createLabel(text, color) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 128;

  const ctx = canvas.getContext('2d');

  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.font = 'bold 54px Arial';
  ctx.fillStyle = color;
  ctx.fillText(text, 20, 70);

  const texture = new THREE.CanvasTexture(canvas);
  texture.needsUpdate = true;

  const material = new THREE.SpriteMaterial({ map: texture });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(2.5, 1.25, 1);

  return sprite;
}

const xLabel = createLabel('x', '#ff5555');
const yLabel = createLabel('y', '#55ff55');
const zLabel = createLabel('z', '#5599ff');

xLabel.position.set(13, 0, 0);
yLabel.position.set(0, 13, 0);
zLabel.position.set(0, 0, 13);

scene.add(xLabel);
scene.add(yLabel);
scene.add(zLabel);

const sphereGeometry = new THREE.SphereGeometry(0.35, 32, 32);

const Pmesh = new THREE.Mesh(
  sphereGeometry,
  new THREE.MeshStandardMaterial({ color: 0xff5555 })
);

const Qmesh = new THREE.Mesh(
  sphereGeometry,
  new THREE.MeshStandardMaterial({ color: 0x55bbff })
);

scene.add(Pmesh);
scene.add(Qmesh);

const fixedPointMesh = new THREE.Mesh(
  sphereGeometry,
  new THREE.MeshStandardMaterial({ color: 0xffffff })
);

scene.add(fixedPointMesh);

const Plabel = createLabel('P', '#ff7777');
const Qlabel = createLabel('Q', '#77bbff');

scene.add(Plabel);
scene.add(Qlabel);

let line1 = null;
let line2 = null;
let plane = null;
let connector = null;

function disposeObject(obj) {
  if (!obj) return;

  scene.remove(obj);

  if (obj.geometry) {
    obj.geometry.dispose();
  }

  if (obj.material) {
    if (Array.isArray(obj.material)) {
      obj.material.forEach(m => m.dispose());
    } else {
      obj.material.dispose();
    }
  }
}

function clearDynamicObjects() {
  disposeObject(line1);
  disposeObject(line2);
  disposeObject(plane);
  disposeObject(connector);

  line1 = null;
  line2 = null;
  plane = null;
  connector = null;
}

function createInfiniteLine(point, direction, color) {
  const points = [];

  for (let t = -25; t <= 25; t += 0.4) {
    points.push(
      new THREE.Vector3(
        point.x + direction.x * t,
        point.y + direction.y * t,
        point.z + direction.z * t
      )
    );
  }

  const geometry = new THREE.BufferGeometry().setFromPoints(points);

  const material = new THREE.LineBasicMaterial({
    color,
    linewidth: 3
  });

  return new THREE.Line(geometry, material);
}

function createPlane(center, normal, color) {
  const geometry = new THREE.PlaneGeometry(18, 18, 10, 10);

  const material = new THREE.MeshStandardMaterial({
    color,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.35,
    wireframe: false
  });

  const mesh = new THREE.Mesh(geometry, material);

  const zAxis = new THREE.Vector3(0, 0, 1);

  const quaternion = new THREE.Quaternion().setFromUnitVectors(
    zAxis,
    normal.clone().normalize()
  );

  mesh.quaternion.copy(quaternion);
  mesh.position.copy(center);

  return mesh;
}

function updateConnector(P, Q) {
  disposeObject(connector);

  const geometry = new THREE.BufferGeometry().setFromPoints([P, Q]);

  const material = new THREE.LineDashedMaterial({
    color: 0xffff00,
    dashSize: 0.4,
    gapSize: 0.2
  });

  connector = new THREE.Line(geometry, material);
  connector.computeLineDistances();

  scene.add(connector);
}

const sliderP = document.getElementById('sliderP');
const sliderQ1 = document.getElementById('sliderQ1');
const sliderQ2 = document.getElementById('sliderQ2');

const labelP = document.getElementById('labelP');
const labelQ1 = document.getElementById('labelQ1');
const labelQ2 = document.getElementById('labelQ2');

const distanceDisplay = document.getElementById('distanceDisplay');
const modeTitle = document.getElementById('modeTitle');
const equationText = document.getElementById('equationText');
const testResults = document.getElementById('testResults');

let mode = 'pointLine';

function setMode(newMode) {
  mode = newMode;

  clearDynamicObjects();

  sliderP.style.display = 'block';
  labelP.style.display = 'block';

  sliderQ1.style.display = 'block';
  labelQ1.style.display = 'block';

  sliderQ2.style.display = 'block';
  labelQ2.style.display = 'block';

  sliderP.value = 0;
  sliderQ1.value = 0;
  sliderQ2.value = 0;

  if (mode === 'pointLine') {

    modeTitle.textContent = 'Point and Line';

    equationText.innerHTML = `
      <b>Point</b>: (5, 4, 3)
      <br><br>
      <b>Line</b>
      <br>
      r = (-4, -1, 1) + λ(2, 1, -1)
    `;

    fixedPointMesh.visible = true;

    line1 = createInfiniteLine(
      new THREE.Vector3(-4, -1, 1),
      new THREE.Vector3(2, 1, -1),
      0x44ffaa
    );

    scene.add(line1);

    sliderP.style.display = 'none';
    labelP.style.display = 'none';

    sliderQ2.style.display = 'none';
    labelQ2.style.display = 'none';
  }

  else if (mode === 'pointPlane') {

    modeTitle.textContent = 'Point and Plane';

    equationText.innerHTML = `
      <b>Point</b>: (5, 6, 7)
      <br><br>
      <b>Plane</b>
      <br>
      x + y + 2z = 0
    `;

    fixedPointMesh.visible = true;

    plane = createPlane(
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(1, 1, 2),
      0x3399ff
    );

    scene.add(plane);

    sliderP.style.display = 'none';
    labelP.style.display = 'none';
  }

  else if (mode === 'parallelLines') {

    modeTitle.textContent = 'Parallel Lines';

    equationText.innerHTML = `
      <b>Line 1</b>
      <br>
      r = (-5, -2, -2) + λ(1, 2, 1)
      <br><br>
      <b>Line 2</b>
      <br>
      r = (3, 4, -1) + μ(1, 2, 1)
    `;

    fixedPointMesh.visible = false;

    line1 = createInfiniteLine(
      new THREE.Vector3(-5, -2, -2),
      new THREE.Vector3(1, 2, 1),
      0xff6666
    );

    line2 = createInfiniteLine(
      new THREE.Vector3(3, 4, -1),
      new THREE.Vector3(1, 2, 1),
      0x66bbff
    );

    scene.add(line1);
    scene.add(line2);

    sliderQ2.style.display = 'none';
    labelQ2.style.display = 'none';
  }

  else if (mode === 'skewLines') {

    modeTitle.textContent = 'Non-Parallel (Skew) Lines';

    equationText.innerHTML = `
      <b>Line 1</b>
      <br>
      r = (-6, -1, -2) + λ(2, 1, 0)
      <br><br>
      <b>Line 2</b>
      <br>
      r = (3, 4, 2) + μ(-1, 1, 2)
    `;

    fixedPointMesh.visible = false;

    line1 = createInfiniteLine(
      new THREE.Vector3(-6, -1, -2),
      new THREE.Vector3(2, 1, 0),
      0xff6666
    );

    line2 = createInfiniteLine(
      new THREE.Vector3(3, 4, 2),
      new THREE.Vector3(-1, 1, 2),
      0x66bbff
    );

    scene.add(line1);
    scene.add(line2);

    sliderQ2.style.display = 'none';
    labelQ2.style.display = 'none';
  }

  updateScene();
}

window.setMode = setMode;

function updateScene() {

  const t = parseFloat(sliderP.value);
  const u = parseFloat(sliderQ1.value);
  const v = parseFloat(sliderQ2.value);

  let P;
  let Q;

  if (mode === 'pointLine') {

    P = new THREE.Vector3(5, 4, 3);

    Q = new THREE.Vector3(
      -4 + 2 * u,
      -1 + u,
      1 - u
    );

    fixedPointMesh.position.copy(P);
  }

  else if (mode === 'pointPlane') {

    P = new THREE.Vector3(5, 6, 7);

    const origin = new THREE.Vector3(0, 0, 0);

    const basis1 = new THREE.Vector3(1, -1, 0);
    const basis2 = new THREE.Vector3(1, 1, -1);

    Q = origin.clone()
      .add(basis1.clone().multiplyScalar(u))
      .add(basis2.clone().multiplyScalar(v));

    fixedPointMesh.position.copy(P);
  }

  else if (mode === 'parallelLines') {

    P = new THREE.Vector3(
      -5 + t,
      -2 + 2 * t,
      -2 + t
    );

    Q = new THREE.Vector3(
      3 + u,
      4 + 2 * u,
      -1 + u
    );
  }

  else if (mode === 'skewLines') {

    P = new THREE.Vector3(
      -6 + 2 * t,
      -1 + t,
      -2
    );

    Q = new THREE.Vector3(
      3 - u,
      4 + u,
      2 + 2 * u
    );
  }

  Pmesh.position.copy(P);
  Qmesh.position.copy(Q);

  Plabel.position.copy(P.clone().add(new THREE.Vector3(0.6, 0.6, 0.6)));
  Qlabel.position.copy(Q.clone().add(new THREE.Vector3(0.6, 0.6, 0.6)));

  updateConnector(P, Q);

  const distance = P.distanceTo(Q);

  distanceDisplay.innerHTML = `
    <b>Current distance</b><br>
    |PQ| = ${distance.toFixed(3)}
    <br><br>
    <b>P</b> = (${P.x.toFixed(2)}, ${P.y.toFixed(2)}, ${P.z.toFixed(2)})
    <br>
    <b>Q</b> = (${Q.x.toFixed(2)}, ${Q.y.toFixed(2)}, ${Q.z.toFixed(2)})
  `;
}

sliderP.addEventListener('input', updateScene);
sliderQ1.addEventListener('input', updateScene);
sliderQ2.addEventListener('input', updateScene);

function runTests() {

  const results = [];

  results.push(
    typeof THREE !== 'undefined'
      ? '✓ THREE imported successfully'
      : '✗ THREE failed to load'
  );

  results.push(
    scene instanceof THREE.Scene
      ? '✓ Scene created'
      : '✗ Scene creation failed'
  );

  results.push(
    camera instanceof THREE.PerspectiveCamera
      ? '✓ Camera created'
      : '✗ Camera creation failed'
  );

  results.push(
    renderer instanceof THREE.WebGLRenderer
      ? '✓ Renderer created'
      : '✗ Renderer failed'
  );

  const distanceTest = new THREE.Vector3(0,0,0)
    .distanceTo(new THREE.Vector3(3,4,0));

  results.push(
    Math.abs(distanceTest - 5) < 0.0001
      ? '✓ Distance calculations working'
      : '✗ Distance calculation failed'
  );

  testResults.textContent = results.join('\n');
}

setMode('pointLine');
runTests();

function animate() {
  requestAnimationFrame(animate);

  controls.update();

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);

});

</script>

</body>
</html>
